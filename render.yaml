# Render Blueprint: Dashboard > New > Blueprint > pick your repo.
services:
  - type: web
    name: pragati-ai
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PRAGATI_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false          # free key from https://aistudio.google.com/apikey — paste in the Render dashboard, never in git
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_API_KEY
        sync: false          # optional alternative (OpenAI / Groq); leave empty if you use Gemini
